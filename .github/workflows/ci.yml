name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fhq
          POSTGRES_PASSWORD: fhq_dev_password
          POSTGRES_DB: findhousequick_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fhq -d findhousequick_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://fhq:fhq_dev_password@localhost:5432/findhousequick_test?schema=public
      # Only used to generate the Prisma client; tests use TEST_DATABASE_URL.
      DATABASE_URL: postgresql://fhq:fhq_dev_password@localhost:5432/findhousequick_test?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
      - name: Check migrations match the schema
        run: |
          out=$(npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --script)
          echo "$out"
          echo "$out" | grep -q "empty migration" || (echo "Schema and migrations differ" && exit 1)

  app:
    name: App (analyse, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  api-design:
    name: API design (OpenAPI lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npx -y @redocly/cli@latest lint docs/api/openapi.yaml --format=summary
