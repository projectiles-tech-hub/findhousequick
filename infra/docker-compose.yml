name: findhousequick

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: fhq
      POSTGRES_PASSWORD: fhq_dev_password
      POSTGRES_DB: findhousequick
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fhq -d findhousequick"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
